rubrik: |
  # System Design Interview Evaluation Rubric - <SYSTEM> (20-minute Mock, Architecture Board)

  ## 1. Requirements Analysis & Clarification (15% - 3-4 minutes)
  - <4–5 "Did they…" checks specific to this question's scoping axes>

  ## 2. Capacity Planning & Estimation (10% - 2-3 minutes)
  - <3–4 checks naming this question's actual numbers>
  - Did they work the math visibly (scribed in the shared notepad with the interviewer)?

  ## 3. System Architecture & Design on the Board (25% - 4-5 minutes)
  - Did they place all core components (<the 3–4 load-bearing palette names>)?
  - <check for the question's key architectural choice>
  - Is the <CORE-OPERATION> flow traceable through their connections?
  - <check for storage/cache/offline-path components on the board>
  - Were edges labeled meaningfully (protocols, calls) rather than left as bare arrows?

  ## 4. Technical Deep Dives (30% - 5-6 minutes)
  - **<Dive area 1>**: <check>
  - **<Dive area 2>**: <check>
  - **Database Design**: Did they provide a reasonable schema? <DB choice> justified?
  - **<Dive area 4>**: <check>
  - **<Dive area 5>** (if probed): <check>

  ## 5. Scalability & Additional Topics (15% - 3-4 minutes)
  - Did they mark horizontally scaled tiers (<which>) as distributed on the board?
  - <caching / CDN / monitoring checks as applicable>
  - Did they address <this question's failure scenario>?

  ## 6. Board Usage & Communication (5%)
  - Did they build the board incrementally while thinking out loud (vs one dump at the end, or talking without drawing)?
  - Could they trace <CORE-OPERATION> end-to-end through their own diagram?
  - Did they revise the board in response to challenges (rewiring, replacing components)?
  - Did they engage with the interviewer's notes and hints (confirmed or corrected the notepad, applied hints on the board)?
  - Did they manage time well within 20 minutes?

  ## Overall Assessment Categories

  ### Strong Hire
  - <6–7 anchors; MUST name the load-bearing component placed unprompted, visible capacity math, labeled edges / distributed marks, incremental building>

  ### Hire
  - <anchors: got there, possibly with hints; mostly connected graph; some scaling>

  ### Lean Hire
  - <anchors: needed hints for the key choice; sparse/floating elements; limited depth>

  ### No Hire
  - <anchors; MUST name the disqualifying naive choice (Messenger's "suggested HTTP polling for real-time"); could not trace the operation; board contradicted speech>

  ## Time Management Guidelines
  - If candidate spends too long on requirements (>5 min), gently redirect
  - Ensure they have time for at least one deep dive
  - Leave 1-2 minutes for wrap-up and questions

  ## Key Technical Points to Assess
  1. <5–6 numbered, question-specific fundamentals>
